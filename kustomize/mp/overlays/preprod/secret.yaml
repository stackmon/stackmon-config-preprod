apiVersion: v1
kind: Secret
metadata:
  name: metrics-processor-oidc
  labels:
    app.kubernetes.io/name: metrics-processor
    app.kubernetes.io/component: convertor-reporter
type: Opaque
stringData:
  # Block scalar, not a quoted string: the substituted value is a JSON
  # document full of double quotes, which would break a double-quoted YAML
  # scalar. AVP selects the field with '#', not '?field='.
  service-account.json: |
    <path:secret/data/stackmon/metrics-processor#zitadel-profile>
