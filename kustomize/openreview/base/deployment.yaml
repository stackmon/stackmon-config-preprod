apiVersion: apps/v1
kind: Deployment
metadata:
  name: openreview
  labels:
    app.kubernetes.io/name: openreview
spec:
  # The review queue and the "review a revision once" dedup state are in-process
  # memory: a second replica would review and approve the same revision twice,
  # and RollingUpdate would overlap two webhook receivers. Recreate keeps exactly
  # one receiver; the gap is covered by GitHub's webhook redelivery.
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: openreview
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openreview
    spec:
      serviceAccountName: openreview
      terminationGracePeriodSeconds: 30
      # SWR is private; the secret is replicated to every namespace by
      # kubernetes-replicator (see system-config pull-secrets chart).
      imagePullSecrets:
        - name: swr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: openreview
          image: openreview
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
          envFrom:
            - configMapRef:
                name: openreview-config
            - secretRef:
                name: openreview-env
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 800Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # The read-only checkout of each reviewed branch.
            - name: workspaces
              mountPath: /data
      volumes:
        - name: workspaces
          emptyDir:
            sizeLimit: 2Gi
