apiVersion: v1
kind: Secret
metadata:
  name: openreview-env
  labels:
    app.kubernetes.io/name: openreview
type: Opaque
stringData:
  # Block scalars, not quoted strings: AVP substitutes arbitrary content and a
  # double-quoted YAML scalar would break on it. Strip the trailing newline with
  # '|-': these keys are injected as environment variables, where that newline
  # becomes part of the value. AVP selects a field with '#', not '?field='.
  # GITHUB_APP_PRIVATE_KEY is stored as a single line with literal \n; the tenant
  # registry expands it back into a PEM.
  #
  # The variables below are the ones the first tenant in tenants.json refers to.
  # A tenant added later follows the same pattern: store its private key and
  # webhook secret in Vault, add e.g. ACME_APP_PRIVATE_KEY / ACME_APP_WEBHOOK_SECRET
  # here, and point that tenant's privateKeyEnv / webhookSecretEnv at them.
  GITHUB_APP_ID: |-
    <path:secret/data/stackmon/openreview#github_app_id>
  GITHUB_APP_INSTALLATION_ID: |-
    <path:secret/data/stackmon/openreview#github_app_installation_id>
  GITHUB_APP_PRIVATE_KEY: |-
    <path:secret/data/stackmon/openreview#github_app_private_key>
  GITHUB_APP_WEBHOOK_SECRET: |-
    <path:secret/data/stackmon/openreview#github_app_webhook_secret>
  LLM_BASE_URL: |-
    <path:secret/data/stackmon/openreview#llm_base_url>
  LLM_API_KEY: |-
    <path:secret/data/stackmon/openreview#llm_api_key>
  LLM_MODEL: |-
    <path:secret/data/stackmon/openreview#llm_model>
