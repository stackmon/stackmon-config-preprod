apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sd3-test

resources:
  - ../../base

images:
  - name: sd3-api
    newName: swr.eu-de.otc.t-systems.com/stackmon/status-dashboard
    newTag: sha-844ad25

configMapGenerator:
  - name: sd3-vault-config
    files:
      - vault-agent.hcl

patchesStrategicMerge:
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: sd3-api
    spec:
      template:
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  # Node 192.168.150.79 cannot reach the Vault ClusterIP
                  # (cross-node i/o timeout), so the vault-agent init container
                  # never authenticates and the pod is stuck in Init. Keep it out
                  # of the scheduling pool until the node's networking is fixed.
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                    - "192.168.150.79"
  - |-
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: sd3-api-ingress
      annotations:
        # WAF front door: DNS-01 instead of the HTTP-01 issuer from base. The
        # host's only record will point at the dedicated WAF ELB, which has no
        # port 80, so HTTP-01 could never renew again. ECDSA P-384 in PKCS8
        # form because that is what the certificate sync in the system-config
        # repository (overlay test-status) uploads to the ELB verbatim.
        cert-manager.io/cluster-issuer: otc-dns01
        cert-manager.io/private-key-algorithm: ECDSA
        cert-manager.io/private-key-size: "384"
        cert-manager.io/private-key-encoding: PKCS8
        cert-manager.io/private-key-rotation-policy: Always
        # WAF-only whitelist, enabled once the A record points at the WAF ELB.
        # nginx.ingress.kubernetes.io/whitelist-source-range: "192.168.243.0/24"
        nginx.ingress.kubernetes.io/configuration-snippet: |
          more_set_headers "X-Frame-Options: DENY";
          more_set_headers "Content-Security-Policy: frame-ancestors 'none'";
    spec:
      rules:
        - host: test.status.otc-service.com
          http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: sd3-api
                  port:
                    number: 8000
      tls:
      - hosts:
        - test.status.otc-service.com
        # Reused from the retired frontend ingress: the certificate is already
        # issued for this exact hostname.
        secretName: sd3-front-cert-test
