apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sd3-test

resources:
  - ../../base

images:
  - name: sd3-api
    newName: swr.eu-de.otc.t-systems.com/stackmon/status-dashboard
    newTag: sha-844ad25

configMapGenerator:
  - name: sd3-vault-config
    files:
      - vault-agent.hcl

patchesStrategicMerge:
  - |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: sd3-api
    spec:
      template:
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  # Node 192.168.150.79 cannot reach the Vault ClusterIP
                  # (cross-node i/o timeout), so the vault-agent init container
                  # never authenticates and the pod is stuck in Init. Keep it out
                  # of the scheduling pool until the node's networking is fixed.
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                    - "192.168.150.79"
  - |-
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: sd3-api-ingress
      annotations:
        nginx.ingress.kubernetes.io/configuration-snippet: |
          more_set_headers "X-Frame-Options: DENY";
          more_set_headers "Content-Security-Policy: frame-ancestors 'none'";
    spec:
      rules:
        - host: test.status.otc-service.com
          http:
            paths:
            - path: /
              pathType: Prefix
              backend:
                service:
                  name: sd3-api
                  port:
                    number: 8000
      tls:
      - hosts:
        - test.status.otc-service.com
        # Reused from the retired frontend ingress: the certificate is already
        # issued for this exact hostname.
        secretName: sd3-front-cert-test
